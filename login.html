<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — أنمي فلكس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">🍥 أنمي<span>فلكس</span></a>
    <div style="flex:1"></div>
    <button class="icon-btn" id="themeToggle" title="تبديل الوضع">🌙</button>
  </div>
</header>

<main class="container">
  <div class="auth-wrap">
    <h2 style="text-align:center;margin-bottom:6px" id="formTitle">تسجيل الدخول</h2>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px">تابع أنمياتك المفضلة واحفظ تقدمك</p>

    <form id="authForm">
      <div class="field" id="nameField" style="display:none">
        <label>الاسم</label>
        <input type="text" id="nameInput" placeholder="اسمك">
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="emailInput" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="passInput" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%;padding:12px">دخول</button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted)">
      <span id="switchText">ليس لديك حساب؟</span>
      <a href="#" id="switchLink" style="color:var(--accent);font-weight:700">أنشئ حسابًا</a>
    </p>

    <p style="text-align:center;margin-top:10px;font-size:12px;color:var(--muted)">
      * هذا نموذج تجريبي يحفظ البيانات محليًا في متصفحك فقط، وليس نظام حسابات حقيقي.
    </p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  let mode = "login";
  document.getElementById("switchLink").addEventListener("click", (e) => {
    e.preventDefault();
    mode = mode === "login" ? "signup" : "login";
    document.getElementById("formTitle").textContent = mode === "login" ? "تسجيل الدخول" : "إنشاء حساب";
    document.getElementById("nameField").style.display = mode === "signup" ? "block" : "none";
    document.getElementById("switchText").textContent = mode === "login" ? "ليس لديك حساب؟" : "لديك حساب بالفعل؟";
    document.getElementById("switchLink").textContent = mode === "login" ? "أنشئ حسابًا" : "سجّل الدخول";
  });

  document.getElementById("authForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("emailInput").value;
    const name = document.getElementById("nameInput").value || email.split("@")[0];
    setUser({ name, email });
    location.href = "profile.html";
  });
</script>
</body>
</html>
